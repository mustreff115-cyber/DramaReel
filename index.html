<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaWave Video Player</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #141414; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
        }
        .player-box { 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        video { 
            width: 100%; 
            display: block; 
            max-height: 500px; 
        }
        .controls-pane { 
            padding: 20px; 
            background: #1f1f1f; 
            margin-top: 15px; 
            border-radius: 8px; 
        }
        .episode-grid { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 10px 0; 
        }
        .ep-btn { 
            background: #333; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 4px; 
            cursor: pointer; 
            flex-shrink: 0; 
            transition: background 0.2s;
        }
        .ep-btn.active { 
            background: #e50914; 
            font-weight: bold; 
        }
        .ep-btn:hover { 
            background: #555; 
        }
        .debug-box {
            background: #111;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 13px;
        }
        .debug-box span { color: #4da6ff; }
        .debug-error { color: #ff6b6b; margin-top: 8px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="series-title">Loading Series...</h1>
    <p id="series-desc"></p>

    <div class="player-box">
        <video id="dramaVideo" controls>
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="controls-pane">
        <h3>Select Episode</h3>
        <div id="episodeList" class="episode-grid"></div>

        <div class="debug-box">
            <div><strong>Current Video Path:</strong> <span id="debugUrl">None</span></div>
            <div><strong>Segment Part:</strong> <span id="debugIndex">0 / 0</span></div>
            <div id="debugError" class="debug-error"></div>
        </div>
    </div>
</div>

<!-- Load Data from datadrama.js -->
<script src="datadrama.js"></script>
<script>
    const currentSeriesId = 34567; 
    const seriesData = typeof dramaDataset !== 'undefined' ? dramaDataset.find(s => s.id === currentSeriesId) : null;

    let currentSegmentIndex = 0;
    let activeSegments = [];

    const videoElem = document.getElementById('dramaVideo');
    const debugUrlElem = document.getElementById('debugUrl');
    const debugIndexElem = document.getElementById('debugIndex');
    const debugErrorElem = document.getElementById('debugError');

    if (seriesData) {
        document.getElementById('series-title').innerText = seriesData.Serie;
        document.getElementById('series-desc').innerText = seriesData.Desc;
        buildEpisodeButtons(seriesData);
    } else {
        document.getElementById('series-title').innerText = "Dataset Error";
        debugErrorElem.innerText = "Error: Could not load 'datadrama.js' or find ID 34567.";
    }

    function buildEpisodeButtons(data) {
        const listContainer = document.getElementById('episodeList');
        listContainer.innerHTML = "";

        for (let i = 1; i <= data.NbEp; i++) {
            const btn = document.createElement('button');
            btn.className = `ep-btn ${i === 1 ? 'active' : ''}`;
            btn.innerText = `Ep ${i}`;
            
            btn.onclick = () => {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadEpisode(data, i);
            };

            listContainer.appendChild(btn);
        }
        loadEpisode(data, 1);
    }

    function loadEpisode(data, epNumber) {
        const epKey = `Ep${epNumber}_Seg`;
        const rawSegments = data.Episode[epKey] || [];
        const epFolder = String(epNumber).padStart(3, '0');

        // استخدام الروابط المباشرة من GitHub Raw لتجاوز أخطاء 404 ومشغل الفيديو
        activeSegments = rawSegments.map(segmentName => {
            return `https://raw.githubusercontent.com/mustreff115-cyber/DramaReel/main/${data.Serie}/Ep/${epFolder}/${segmentName}`;
        });

        currentSegmentIndex = 0;
        debugErrorElem.innerText = "";

        if (activeSegments.length > 0) {
            playCurrentSegment();
        } else {
            videoElem.pause();
            videoElem.src = "";
            debugUrlElem.innerText = "None";
            debugIndexElem.innerText = "0 / 0";
            debugErrorElem.innerText = `Notice: Episode ${epNumber} has no segments configured.`;
        }
    }

    function playCurrentSegment() {
        if (currentSegmentIndex < activeSegments.length) {
            const targetUrl = activeSegments[currentSegmentIndex];
            
            videoElem.src = targetUrl;
            debugUrlElem.innerText = targetUrl;
            debugIndexElem.innerText = `${currentSegmentIndex + 1} of ${activeSegments.length}`;

            videoElem.play().catch(err => {
                console.warn("Autoplay blocked:", err);
                debugErrorElem.innerText = "Notice: Autoplay prevented by browser. Click play manually.";
            });
            
            videoElem.onended = () => {
                currentSegmentIndex++;
                playCurrentSegment();
            };
        }
    }

    videoElem.onerror = () => {
        const err = videoElem.error;
        let errMsg = "Unknown error";
        if (err) {
            switch (err.code) {
                case 1: errMsg = "MEDIA_ERR_ABORTED - Loading aborted."; break;
                case 2: errMsg = "MEDIA_ERR_NETWORK - File Not Found (404). Check if folder and file names match exactly."; break;
                case 3: errMsg = "MEDIA_ERR_DECODE - Decoding error."; break;
                case 4: errMsg = "MEDIA_ERR_SRC_NOT_SUPPORTED - Format not supported."; break;
            }
        }
        debugErrorElem.innerText = `[Video Error Code ${err.code}]: ${errMsg}\nPath checked: ${debugUrlElem.innerText}`;
    };
</script>

</body>
</html>
